name: tuma_app
description: "Tuma — everything you crave, delivered. Customer ordering app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # State, navigation, typography. Every further dependency must earn its
  # place with the slice that needs it (see AGENTS.md).
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^9.2.2
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
