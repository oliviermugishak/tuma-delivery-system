[package]
name = "geocoding"
version.workspace = true
edition.workspace = true

[dependencies]
app-config = { path = "../app-config" }
async-trait = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"

[dependencies.sqlx]
version = "0.9.0"
features = ["runtime-tokio", "tls-rustls", "postgres", "time"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
