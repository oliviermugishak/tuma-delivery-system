[workspace]
members = ["app-config", "accounts", "commerce", "marketplace", "storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "tuma-server"
version.workspace = true
edition.workspace = true
default-run = "tuma-server"

[dependencies]
accounts = { path = "accounts" }
app-config = { path = "app-config" }
commerce = { path = "commerce" }
marketplace = { path = "marketplace" }
storage = { path = "storage" }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
config = "0.15.25"
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-error = "0.2.1"
tracing-bunyan-formatter = "0.3.10"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
validator = { version = "0.21.0", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
tower-http = { version = "0.7.0", features = ["request-id", "trace", "cors"] }
utoipa = { version = "5", features = ["macros", "uuid", "time"] }

[dependencies.sqlx]
version = "0.9.0"
features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "time", "sqlx-toml", "uuid"]

[dev-dependencies]
# PNG/JPEG encode for upload-test fixtures (storage slice).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.4", features = ["json", "cookies", "multipart"] }
