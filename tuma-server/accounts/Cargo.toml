[package]
name = "accounts"
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = { version = "0.6.0-rc.8", features = ["password-hash"] }
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
password-hash = { version = "0.6.1", features = ["alloc", "getrandom"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dependencies.sqlx]
version = "0.9.0"
features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "time", "uuid"]
