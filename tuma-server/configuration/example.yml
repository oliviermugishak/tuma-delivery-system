# Reference of every configuration field. Copy values into base.yml /
# local.yml / production.yml, or override at runtime with APP_*__* env vars
# (e.g. APP_DATABASE__HOST, APP_APPLICATION__PORT). A DATABASE_URL env var
# wins over every APP_DATABASE__* field.
application:
  host: 127.0.0.1
  port: 8080
  cookie_secure: false
database:
  host: localhost
  port: 5432
  username: postgres
  password: password123
  database_name: tuma
  require_ssl: false
  # Pool ceiling: Postgres caps total connections across ALL clients
  # (default 100), so the server must not take them all. Production
  # raises this (see production.yml).
  max_connections: 10
  # How long a request waits for a free pooled connection before failing.
  acquire_timeout_secs: 10
secret:
  # Generate with: openssl rand -base64 64
  jwt_signing_key: ""
storage:
  # local (dev) | memory (tests) | s3 (S3-compatible; Cloudflare R2 in prod).
  # Clients only ever see URLs — a backend swap is config, never code.
  backend: local
  # Where stored objects are served from. Empty = the API's own file route
  # (relative /api/v1/files/… URLs). Production: the R2 public URL (CDN).
  # Dev with a phone on the LAN: http://<machine-ip>:8080/api/v1/files
  public_base_url: ""
  local:
    root: ./data/storage
  s3:
    bucket: ""
    # R2: https://<account-id>.r2.cloudflarestorage.com — empty means AWS S3.
    endpoint: ""
    region: auto
    access_key_id: ""
    secret_access_key: ""
jobs:
  # The hourly maintenance prune (the server's only background job):
  # GPS breadcrumbs older than the retention window and refresh tokens
  # dead (expired or revoked) for longer than it. The first pass runs at
  # startup.
  prune_enabled: true
  prune_retention_days: 30
rate_limit:
  # Per-IP rate limiting on the auth doors (/v1/auth/login,
  # /v1/auth/otp/request) — sliding 60s windows, in-memory. The doors
  # count attempts, not outcomes: a valid login spends the budget too.
  enabled: true
  login_per_minute: 10
  otp_per_minute: 10
