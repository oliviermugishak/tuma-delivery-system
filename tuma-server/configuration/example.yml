# Reference of every configuration field. Copy values into base.yml /
# local.yml / production.yml, or override at runtime with APP_*__* env vars
# (e.g. APP_DATABASE__HOST, APP_APPLICATION__PORT). A DATABASE_URL env var
# wins over every APP_DATABASE__* field.
application:
  host: 127.0.0.1
  port: 8080
  cookie_secure: false
  # Serve a built web frontend (SPA fallback) from this directory.
  # static_dir: /app/web-dist
database:
  host: localhost
  port: 5432
  username: postgres
  password: password123
  database_name: tuma
  require_ssl: false
secret:
  # Generate with: openssl rand -base64 64
  jwt_signing_key: ""
storage:
  # local (dev) | memory (tests) | s3 (S3-compatible; Cloudflare R2 in prod).
  # Clients only ever see URLs — a backend swap is config, never code.
  backend: local
  # Where stored objects are served from. Empty = the API's own file route
  # (relative /api/v1/files/… URLs). Production: the R2 public URL (CDN).
  # Dev with a phone on the LAN: http://<machine-ip>:8080/api/v1/files
  public_base_url: ""
  local:
    root: ./data/storage
  s3:
    bucket: ""
    # R2: https://<account-id>.r2.cloudflarestorage.com — empty means AWS S3.
    endpoint: ""
    region: auto
    access_key_id: ""
    secret_access_key: ""
